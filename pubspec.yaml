
name: quran_app
description: An offline-first Quran application for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path: ^1.9.1
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  just_audio_background: ^0.0.1-beta.15
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3
  geolocator: ^13.0.2
  intl: ^0.20.2
  quran: ^1.4.1
  scrollable_positioned_list: ^0.3.8
  path_provider: ^2.1.6
  flutter_local_notifications: 22.3.3
  timezone: ^0.11.2
  permission_handler: 11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/data/translations/
    - assets/audio/adhan_fixed.mp3
